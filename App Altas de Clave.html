<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Ítems</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#721717;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:#1b285b;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            color:#fcfcfc;
            margin-bottom:25px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
        }

        .full-width{
            grid-column:1 / -1;
        }

        label{
            margin-bottom:6px;
            font-weight:bold;
            color:#ffffff;
        }

        input,
        select,
        textarea{
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }

        textarea{
            resize:vertical;
            min-height:100px;
        }

        .btn-container{
            margin-top:25px;
            text-align:center;
        }

        button{
            background:#0078D4;
            color:white;
            border:none;
            padding:12px 25px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#005ea6;
        }

        @media(max-width:768px){
            .form-grid{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Alta de Claves de Ítems</h1>

        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label for="clave">Clave</label>
                    <input type="text" id="clave" name="clave" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" required>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca">
                </div>

                <div class="form-group">
                    <label for="medidas">Largo / Ancho</label>
                    <input type="text" id="medidas" name="medidas" placeholder="Ej. 20 x 15 cm">
                </div>

                <div class="form-group">
                    <label for="claveSat">Clave SAT</label>
                    <input type="text" id="claveSat" name="claveSat">
                </div>

                <div class="form-group">
                    <label for="pzasCaja">Piezas por Caja</label>
                    <input type="number" id="pzasCaja" name="pzasCaja" min="1">
                </div>

                <div class="form-group">
                    <label for="unidadSat">Clave Unidad SAT</label>
                    <input type="text" id="unidadSat" name="unidadSat">
                </div>

                <div class="form-group">
                    <label for="familia">Familia</label>
                    <select id="familia" name="familia">
                        <option value="">Seleccione...</option>
                        <option>Materia Prima</option>
                        <option>Producto Terminado</option>
                        <option>Consumibles</option>
                        <option>Herramientas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subfamilia">Subfamilia</label>
                    <input type="text" id="subfamilia" name="subfamilia">
                </div>

                <div class="form-group">
                    <label for="unidadMedida">Unidad de Medida</label>
                    <select id="unidadMedida" name="unidadMedida">
                        <option value="">Seleccione...</option>
                        <option>Pieza</option>
                        <option>Caja</option>
                        <option>Metro</option>
                        <option>Kilogramo</option>
                        <option>Litro</option>
                        <option>Paquete</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="comentarios">Comentarios (Opcional)</label>
                    <textarea id="comentarios" name="comentarios"></textarea>
                </div>

            </div>

            <div class="btn-container">
                <button type="submit">Guardar Ítem</button>
            </div>

        </form>

    </div>

</body>
</html>
